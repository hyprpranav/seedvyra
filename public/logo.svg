<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="seedGrad" x1="20" y1="20" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="60%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="circuitGrad" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Bio-Optical Sensor Ring -->
  <circle cx="60" cy="60" r="54" stroke="#e2e8f0" stroke-width="2.5" stroke-dasharray="4 6" />
  <circle cx="60" cy="60" r="48" stroke="url(#circuitGrad)" stroke-width="1.8" opacity="0.6" />

  <!-- Target reticle marks -->
  <line x1="60" y1="4" x2="60" y2="14" stroke="#059669" stroke-width="2.5" stroke-linecap="round" />
  <line x1="60" y1="106" x2="60" y2="116" stroke="#059669" stroke-width="2.5" stroke-linecap="round" />
  <line x1="4" y1="60" x2="14" y2="60" stroke="#059669" stroke-width="2.5" stroke-linecap="round" />
  <line x1="106" y1="60" x2="116" y2="60" stroke="#059669" stroke-width="2.5" stroke-linecap="round" />

  <!-- Botanical Seed Shape -->
  <path d="M60 22 C78 38 88 58 84 76 C80 92 68 100 60 100 C52 100 40 92 36 76 C32 58 42 38 60 22 Z" 
        fill="url(#seedGrad)" />

  <!-- Inner Seed Embryo & Neural Lines -->
  <path d="M60 34 C64 48 66 65 60 88" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
  
  <!-- Neural circuit branches representing optical spectral analysis -->
  <path d="M60 52 L72 44" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <circle cx="72" cy="44" r="2.5" fill="#a7f3d0" />

  <path d="M60 62 L47 56" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <circle cx="47" cy="56" r="2.5" fill="#a7f3d0" />

  <path d="M60 72 L70 76" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <circle cx="70" cy="76" r="2.5" fill="#a7f3d0" />

  <path d="M60 80 L50 82" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <circle cx="50" cy="82" r="2.5" fill="#a7f3d0" />

  <!-- Optical sensor node center -->
  <circle cx="60" cy="42" r="3.5" fill="#ffffff" filter="url(#glow)" />
</svg>
